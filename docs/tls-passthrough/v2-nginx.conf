# Reference configuration for the network-facing machine (v2.absclust.com).
#
# Goal: v2 stops decrypting traffic for v2.absclust.com. It reads only the SNI
# field of the TLS handshake and forwards the raw bytes to the app machine,
# where the certificate and the private key live.
#
# The other sites v2 hosts (odoo.absclust.com, staging.absclust.com) keep being
# served locally, so :443 has to be shared by SNI rather than blindly forwarded.
#
# Tunnel ports on v2 (both are reverse tunnels originating from the app box):
#   127.0.0.1:55445 -> app box :55440   plain HTTP  (ACME challenge)
#   127.0.0.1:55447 -> app box :55443   TLS         (passthrough target)


# ===========================================================================
# 1. STREAM: owns :443, routes by SNI. Goes at the TOP LEVEL of nginx.conf,
#    as a sibling of http{} - not inside it, and not in conf.d/ (which Debian
#    includes from within http{}).
#
#    Requires ngx_stream_ssl_preread_module. Check with:
#      nginx -V 2>&1 | tr ' ' '\n' | grep -E 'stream|preread'
#    On Debian/Ubuntu it ships with nginx-full; if the modules are dynamic,
#    ensure /etc/nginx/modules-enabled/ loads mod-stream.
# ===========================================================================
stream {
    log_format sni '$remote_addr [$time_local] sni=$ssl_preread_server_name '
                   '-> $upstream_addr $status $bytes_sent';
    access_log /var/log/nginx/stream.log sni;

    map $ssl_preread_server_name $tls_upstream {
        # passed through, encrypted, to the app machine
        v2.absclust.com       127.0.0.1:55447;

        # still terminated locally by this machine's http{} block below
        odoo.absclust.com     127.0.0.1:8443;
        staging.absclust.com  127.0.0.1:8443;
        default               127.0.0.1:8443;
    }

    server {
        listen      443 reuseport;
        listen      [::]:443 reuseport;
        ssl_preread on;
        proxy_pass  $tls_upstream;

        # PROXY protocol preserves the real client IP across the layer-4 hop.
        # The app box listens for it on :55443's sibling port - see note at the
        # bottom of this file before enabling.
        # proxy_protocol on;

        proxy_timeout        1h;   # the app uses SSE and long-running requests
        proxy_connect_timeout 10s;
    }
}


# ===========================================================================
# 2. HTTP: the local sites move off :443 to 127.0.0.1:8443, behind the stream
#    block. Everything below lives inside the existing http{} block.
# ===========================================================================

# --- your existing local sites, with the listen directive changed -----------
#
#   server {
#       listen 127.0.0.1:8443 ssl;      # was: listen 443 ssl;
#       http2 on;
#       server_name odoo.absclust.com;
#       ...unchanged...
#   }
#
# If you enable proxy_protocol in the stream block above, these become
#       listen 127.0.0.1:8443 ssl proxy_protocol;
# and each needs, to keep logging real client IPs:
#       set_real_ip_from 127.0.0.1;
#       real_ip_header   proxy_protocol;

# --- port 80: ACME + redirect ----------------------------------------------
#
# The challenge is forwarded at layer 7 on purpose. Challenge tokens are public
# by design, so nothing confidential crosses v2 here, and keeping renewal off
# the passthrough means a broken TLS path can never block a renewal.
server {
    listen      80;
    listen      [::]:80;
    server_name v2.absclust.com;

    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:55445;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ===========================================================================
# NOTES
#
# * Cutover is reversible and has no downtime: the old path
#   (v2 terminates :443 -> proxies to 127.0.0.1:55445) keeps working until you
#   move :443 into the stream block. To roll back, restore the old server block.
#
# * PROXY protocol is all-or-nothing per upstream port. The app box exposes two
#   TLS ports so you can choose without a coordinated restart:
#       127.0.0.1:55447  ->  :55443  plain TLS, no PROXY header  (default)
#       127.0.0.1:55448  ->  :55444  TLS with PROXY header
#   Enabling `proxy_protocol on;` in the stream block means every upstream in
#   the map must expect it - including the local 8443 sites.
#
# * v2's own certificate currently lists v2.absclust.com in its SAN
#   (with odoo. and staging.). It no longer needs to; drop it at the next
#   renewal so this host stops holding a certificate for a name it cannot
#   serve anyway.
# ===========================================================================
