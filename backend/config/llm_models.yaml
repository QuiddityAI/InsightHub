  capabilities: [chat]
  location: US
  parameters: "V4-Flash"
  # NOTE: prices are estimates - litellm has no entry for this model yet.
  usd_per_1M_input_tokens: 0.35
  usd_per_1M_output_tokens: 1.40
  max_input_tokens: 1048576

fireworks_ai/accounts/fireworks/models/qwen3-reranker-8b:
  verbose_name: "Qwen3 Reranker 8B (Fireworks)"
  description: "Multilingual cross-encoder reranker, provided by Fireworks. Default reranking model."
  capabilities: [rerank]
  location: US
  parameters: "8B"
  # Fireworks serves a Cohere-style /v1/rerank endpoint. litellm has no
  # fireworks_ai rerank provider, so the request goes through its "infinity"
  # provider, which speaks the same format (see litellmonkey/rerank_compat.py).
  litellm_model: infinity/accounts/fireworks/models/qwen3-reranker-8b
  litellm_kwargs:
    api_base: "https://api.fireworks.ai/inference"
    api_key: "${FIREWORKS_AI_API_KEY}"
  # NOTE: Fireworks does not list rerank pricing separately; this is the price
  # of their Qwen3 8B embedding tier, which the reranker is billed like.
  usd_per_1M_input_tokens: 0.10
  usd_per_1M_output_tokens: 0.0
  max_input_tokens: 32768

fireworks_ai/accounts/fireworks/models/minimax-m2p7:
