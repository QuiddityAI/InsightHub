# Previous default reranker, kept as an alternative: set defaults.rerank.default
# to this ID (needs COHERE_API_KEY).
cohere/rerank-v3.5:
  verbose_name: "Cohere Rerank v3.5"
  description: "Cohere's combined English + multilingual reranker."
  capabilities: [rerank]
  location: US
  litellm_kwargs:
    api_key: "${COHERE_API_KEY}"
  # Cohere bills reranking per search unit (USD 2.00 / 1k), not per token.
  usd_per_1M_input_tokens: 0.0
  usd_per_1M_output_tokens: 0.0
  max_input_tokens: 4096
