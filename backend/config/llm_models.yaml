# ============================================================
# InsightHub LLM Model Registry
# ============================================================
# Each top-level key is the canonical model ID used in the app.
# For standard litellm providers the key IS the litellm model string.
# For custom OpenAI-compatible providers (nebius, ionos), the key
# uses a virtual prefix and litellm_model specifies the actual string.
#
# Fields:
#   verbose_name   - Display name
#   description    - Short description (optional)
#   capabilities   - [chat], [embeddings], [rerank], [vision, chat]
#   location       - EU / US / CA / OTHER (optional)
#   parameters     - Model size label (optional)
#   aliases        - Old LLMonkey class names for backward compat
#   litellm_model  - Override the model string passed to litellm (optional)
#   litellm_kwargs - Extra kwargs for litellm.completion() (optional)
#   usd_per_1M_input_tokens  - Price override (optional, litellm provides defaults)
#   usd_per_1M_output_tokens - Price override (optional, litellm provides defaults)
#   max_input_tokens          - Context window override (optional)

# ============================================================
# Default model assignments
# ============================================================
defaults:
  # General-purpose tiers
  models:
    small: local/qwen3.6-35b-a3b-nothink
    medium: local/qwen3.6-35b-a3b
    large: fireworks_ai/accounts/fireworks/models/deepseek-v4-flash-0731

  # DSPy task-specific models. These are short-output tasks (titles, language
  # codes, queries), so reasoning is disabled: it dominates latency without
  # improving the answer.
  dspy:
    column_title: local/qwen3.6-35b-a3b-nothink
    column_language: local/qwen3.6-35b-a3b-nothink
    query_language: local/qwen3.6-35b-a3b-nothink
    doc_comparison: local/qwen3.6-35b-a3b-nothink
    search_query: local/qwen3.6-35b-a3b-nothink
    tender_summary: local/qwen3.6-35b-a3b-nothink

  # Fallback chain: models tried in order when the primary model fails
  # (e.g. the local model server is down or the input exceeds its context).
  # Supports any litellm model ID registered below.
  fallback_chain:
    - fireworks_ai/accounts/fireworks/models/deepseek-v4-flash-0731

  # Reranking model used for search result / chunk reranking.
  # Any model below with capabilities: [rerank] can be used here.
  rerank:
    default: fireworks_ai/accounts/fireworks/models/qwen3-reranker-8b

  # PDFerret processing models. PDFerret vendors litellmonkey and reads this
  # same file (mounted into its container), so these are canonical IDs too.
  # Reasoning is disabled here: pdferret caps output at 500-1000 max_tokens, which
  # reasoning tokens exhaust before any content is produced (yielding empty responses).
  pdferret:
    vision: local/qwen3.6-35b-a3b-nothink
    text: local/qwen3.6-35b-a3b-nothink
# ============================================================

# ==================== Local (self-hosted) ====================

# llama.cpp / OpenAI-compatible server on the Docker host.
# LOCAL_LLM_SERVER_URL overrides the endpoint (inside containers this must be
# reachable from the container, e.g. http://host.docker.internal:18234/v1).
local/qwen3.6-35b-a3b:
  verbose_name: "Qwen3.6 35B A3B (local)"
  description: "Locally hosted Qwen3.6 35B-A3B MoE, served by llama.cpp. Vision requires the server to be started with --mmproj."
  capabilities: [vision, chat]
  location: EU
  parameters: "35B-A3B"
  litellm_model: openai/qwen3.6-35b-a3b
  litellm_kwargs:
    api_base: "${LOCAL_LLM_SERVER_URL:-http://localhost:18234/v1}"
    api_key: "no_api_key"
  usd_per_1M_input_tokens: 0.0
  usd_per_1M_output_tokens: 0.0
  max_input_tokens: 32768

# Same local model with reasoning turned off (the Qwen3.6 chat template emits an
# empty <think></think> block when enable_thinking is false). Used for the "small"
# tier, where reasoning tokens dominate latency and can starve max_tokens.
local/qwen3.6-35b-a3b-nothink:
  verbose_name: "Qwen3.6 35B A3B (local, no reasoning)"
  description: "Locally hosted Qwen3.6 35B-A3B with reasoning disabled, served by llama.cpp."
  capabilities: [vision, chat]
  location: EU
  parameters: "35B-A3B"
  litellm_model: openai/qwen3.6-35b-a3b
  litellm_kwargs:
    api_base: "${LOCAL_LLM_SERVER_URL:-http://localhost:18234/v1}"
    api_key: "no_api_key"
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  usd_per_1M_input_tokens: 0.0
  usd_per_1M_output_tokens: 0.0
  max_input_tokens: 32768


