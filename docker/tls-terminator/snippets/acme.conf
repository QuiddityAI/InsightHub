# ACME http-01 challenge responses, written into the shared webroot volume by
# the certbot container. Served from every server block so that renewal works
# no matter which path Let's Encrypt reaches us through.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    access_log /var/log/nginx/acme.log main;
}
