# Proxy to the frontend container. Included from every server block.

# proxy_pass with a variable is re-resolved through the resolver at runtime
# instead of being pinned at startup. With no URI part, the original request
# URI is passed through unchanged.
set $app_upstream "http://webserver-staging:55140";
proxy_pass $app_upstream;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# The app streams results (SSE) and accepts large uploads, so neither
# direction may be buffered and both need generous timeouts.
proxy_buffering         off;
proxy_request_buffering off;
proxy_read_timeout      3600s;
proxy_send_timeout      3600s;
proxy_connect_timeout   30s;
