# TLS terminator for the staging/production stack.
#
# This container is the only place where TLS is terminated and where the
# private key exists. The network-facing machine (v2.absclust.com) is a
# layer-4 relay: it forwards the encrypted bytes here without decrypting them.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    keepalive_timeout 65;
    client_max_body_size 0;  # the app uploads whole documents; no limit here

    # Docker's embedded DNS. Combined with the variable in proxy_pass (see
    # snippets/proxy_app.conf) this makes upstream names re-resolve at runtime,
    # so recreating webserver-staging does not require restarting nginx.
    resolver 127.0.0.11 valid=30s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
